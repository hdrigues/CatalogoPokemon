<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Catálogo ZS</title>
  <link rel="stylesheet" href="/styles/theme.css" />
</head>
<body>
  <header class="app-header">
    <h1><span class="pokeball-icon"></span>Catálogo ZS</h1>
    <a class="header-link" href="admin.html">Admin</a>
  </header>

  <main>
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="todos">Todos</button>
      <button class="filter-btn" data-filter="disponivel">Disponíveis</button>
      <button class="filter-btn" data-filter="emprestado">Emprestados</button>
      <button class="filter-btn" data-filter="venda">À venda</button>
    </div>

    <div class="filters-extra">
      <select id="filtro-elemento">
        <option value="todos">Todos os elementos</option>
      </select>
      <select id="filtro-ordenar">
        <option value="nome">Nome (A-Z)</option>
        <option value="nivel-desc">Nível: maior → menor</option>
        <option value="nivel-asc">Nível: menor → maior</option>
      </select>
    </div>

    <div id="grid" class="grid">
      <div class="spinner-wrap">Carregando pokémons...</div>
    </div>
  </main>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal-sheet" id="modal-sheet"></div>
  </div>

  <script type="module" src="/src/catalog.js"></script>
</body>
</html>
